[package]
name = "paperflow"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ttf-parser = "0.25.1"
typst = "=0.15.1"
typst-embed = { version = "0.1", features = ["bundled-fonts", "pdf", "system-downloader"] }
typst-kit = { version = "0.15.1", features = ["scan-fonts"] }
uuid = { version = "1", features = ["v4"] }
